name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-check-all
      - name: PHP syntax check
        run: |
          find src tests examples -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Offline smoke tests (no credentials or requests)
        run: php tests/offline-smoke.php
